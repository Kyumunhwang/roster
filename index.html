<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자퇴/휴학생 분석 대시보드</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #555;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .data-table-container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        tr:hover {
            background-color: #fcfcfc;
        }
        .stats-summary {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
        }
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>학원 자퇴/휴학생 분석</h1>
        <p>roster.xlsx 데이터를 기반으로 한 통계 대시보드</p>
        <a href="add.html" style="display: inline-block; margin-top: 15px; padding: 12px 24px; background-color: var(--primary-color); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(74, 144, 226, 0.3); transition: transform 0.2s;">+ 새 학생 추가하기</a>
        <a href="manage.html" style="display: inline-block; margin-top: 15px; margin-left: 10px; padding: 12px 24px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; box-shadow: 0 4px 6px rgba(108, 117, 125, 0.3);">데이터 관리/삭제</a>
    </header>

    <div class="stats-summary card">
        <div class="stat-item">
            <div id="total-count" class="stat-value">0</div>
            <div class="stat-label">총 인원</div>
        </div>
        <div class="stat-item">
            <div id="dropout-count" class="stat-value">0</div>
            <div class="stat-label">자퇴</div>
        </div>
        <div class="stat-item">
            <div id="leave-count" class="stat-value">0</div>
            <div class="stat-label">휴학</div>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- 성별 비율 차트 -->
        <div class="card">
            <h2>남녀 성별 비율</h2>
            <div class="chart-container">
                <canvas id="genderChart"></canvas>
            </div>
        </div>

        <!-- 학년별 분포 차트 -->
        <div class="card">
            <h2>학년별 분포 (Grade)</h2>
            <div class="chart-container">
                <canvas id="gradeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 상세 데이터 테이블 -->
    <div class="data-table-container">
        <h2>상세 명단</h2>
        <table id="roster-table">
            <thead>
                <tr>
                    <th>이름</th>
                    <th>상태</th>
                    <th>성별</th>
                    <th>학년</th>
                    <th>사유</th>
                </tr>
            </thead>
            <tbody>
                <!-- JS에서 데이터 삽입 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadDashboard() {
        try {
            // 1. JSON 데이터 가져오기 (API 서버에서)
            const response = await fetch('/api/roster');
            const data = await response.json();

            // 2. 기본 통계 계산
            const total = data.length;
            const dropouts = data.filter(d => d.status_type === '자퇴').length;
            const leaves = data.filter(d => d.status_type === '휴학').length;

            document.getElementById('total-count').innerText = total;
            document.getElementById('dropout-count').innerText = dropouts;
            document.getElementById('leave-count').innerText = leaves;

            // 3. 차트 데이터 가공 (성별)
            const genderCounts = data.reduce((acc, curr) => {
                const g = curr.gender === 'M' ? '남성' : (curr.gender === 'F' ? '여성' : '기타');
                acc[g] = (acc[g] || 0) + 1;
                return acc;
            }, {});

            // 4. 차트 데이터 가공 (학년)
            const gradeCounts = data.reduce((acc, curr) => {
                const g = curr.grade ? `Grade ${curr.grade}` : '미분류';
                acc[g] = (acc[g] || 0) + 1;
                return acc;
            }, {});

            // 학년순 정렬 (Grade 7, 8, 9...)
            const sortedGrades = Object.keys(gradeCounts).sort((a, b) => {
                const numA = parseInt(a.replace(/[^0-9]/g, '')) || 0;
                const numB = parseInt(b.replace(/[^0-9]/g, '')) || 0;
                return numA - numB;
            });

            // 5. 성별 차트 그리기
            new Chart(document.getElementById('genderChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(genderCounts),
                    datasets: [{
                        data: Object.values(genderCounts),
                        backgroundColor: ['#4a90e2', '#ff6384', '#ffcd56'],
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // 6. 학년별 차트 그리기
            new Chart(document.getElementById('gradeChart'), {
                type: 'bar',
                data: {
                    labels: sortedGrades,
                    datasets: [{
                        label: '학생 수',
                        data: sortedGrades.map(g => gradeCounts[g]),
                        backgroundColor: 'rgba(74, 144, 226, 0.6)',
                        borderColor: 'rgba(74, 144, 226, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });

            // 7. 테이블 데이터 채우기
            const tbody = document.querySelector('#roster-table tbody');
            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.name || '-'}</td>
                        <td>${item.status_type || '-'}</td>
                        <td>${item.gender || '-'}</td>
                        <td>${item.grade || '-'}</td>
                        <td>${item.status_reason || item.remarks || '-'}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

        } catch (error) {
            console.error('Error loading data:', error);
            alert('데이터를 불러오는 중 오류가 발생했습니다. 로컬 서버(Live Server 등) 환경에서 실행해주세요.');
        }
    }

    window.onload = loadDashboard;
</script>

</body>
</html>
